[project]
name = "easygroove"
version = "0.1.0"
requires-python = ">=3.10"
# A Vercel instala a partir daqui (lê o pyproject antes do requirements.txt): mantenha as duas listas iguais
dependencies = [
    "bcrypt==5.0.0",
    "fastapi==0.141.1",
    "Jinja2==3.1.6",
    "psycopg[binary]==3.3.9",
    "pydantic==2.13.4",
    "PyJWT==2.13.0",
    "python-dotenv==1.2.3",
    "SQLAlchemy==2.0.52",
    "sqlmodel==0.0.39",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

# Serve /assets (JS, CSS, ícones e .wav) pelo CDN da Vercel, não pela função
[tool.vercel.fastapi.static]
cdn = true
