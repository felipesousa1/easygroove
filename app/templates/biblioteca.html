<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyGroove — Biblioteca</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Inclusão do HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body class="lib-body">

    <!-- Cabeçalho -->
    <header class="lib-header">
        <div class="lib-header-left">
            <a href="/biblioteca" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="assets/icons/logo.svg" alt="EasyGroove Logo" class="lib-logo">
                <span class="lib-brand">EasyGroove</span>
            </a>
        </div>
        <div class="lib-header-right">
            <span class="lib-username">@{{ user.username }}</span>
            <div class="lib-avatar">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
            </div>
            <button class="lib-settings-btn" id="btn-logout" title="Sair da Conta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="lib-main">
        <h1 class="lib-title">Biblioteca</h1>

        <div class="lib-content">

            <!-- Barra Lateral (Coleções) -->
            <aside class="lib-sidebar">
                <button type="button" class="lib-btn-primary active" id="btn-all-arrangements"
                    hx-get="/biblioteca/search" hx-target="#arrangements-grid"
                    hx-include="#lib-search-input, #lib-sort-select">
                    Todos os arranjos
                </button>

                <div class="lib-sidebar-divider"></div>

                <h2 class="lib-subtitle">Coleções</h2>
                <ul class="lib-collection-list" id="collection-list-container">
                    {% include "partials/collections_list.html" %}
                </ul>

                <button type="button" class="lib-btn-add-dashed" id="btn-add-collection">+ Nova coleção</button>
            </aside>

            <!-- Área Principal (Grade de Arranjos) -->
            <section class="lib-workspace">

                <div class="lib-toolbar">
                    <div class="lib-search-bar">
                        <svg class="lib-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" name="q" id="lib-search-input" placeholder="Buscar arranjo..."
                            hx-get="/biblioteca/search" hx-trigger="keyup changed delay:300ms, search"
                            hx-target="#arrangements-grid" hx-include="#lib-sort-select">
                    </div>

                    <div class="lib-filters">
                        <span class="lib-filter-label">Ordenar por:</span>
                        <select class="lib-sort-select" name="sort_by" id="lib-sort-select" hx-get="/biblioteca/search"
                            hx-trigger="change" hx-target="#arrangements-grid" hx-include="#lib-search-input">
                            <option value="az">A-Z (Ordem Alfabética)</option>
                            <option value="recent">Mais recentes</option>
                            <option value="old">Mais antigos</option>
                        </select>
                    </div>
                </div>

                <div class="lib-grid" id="arrangements-grid">
                    {% include "partials/arrangements_grid.html" %}
                </div>

                <!-- Container flutuante que trava o botão no rodapé do box -->
                <div class="lib-fab-wrapper">
                    <button class="lib-fab" onclick="window.location.href='/'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"></path>
                        </svg>
                        Criar
                    </button>
                </div>

            </section>
        </div>
    </main>

    <footer class="lib-footer">
        &copy; 2026 - EasyGroove
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Logout
            const btnLogout = document.getElementById("btn-logout");
            if (btnLogout) {
                btnLogout.addEventListener("click", async () => {
                    await fetch("/api/auth/logout", { method: "POST" });
                    window.location.href = "/login";
                });
            }

            // Ações do Dropdown dos Cards
            document.addEventListener("click", async (e) => {
                const editBtn = e.target.closest(".btn-action-edit");
                if (editBtn) {
                    e.stopPropagation();
                    window.location.href = `/?id=${editBtn.dataset.id}`;
                    return;
                }

                const renameBtn = e.target.closest(".btn-action-rename");
                if (renameBtn) {
                    e.stopPropagation();
                    const id = renameBtn.dataset.id;
                    const currentName = renameBtn.dataset.name;
                    const newName = prompt("Novo nome do arranjo:", currentName);

                    if (newName && newName.trim() && newName !== currentName) {
                        const res = await fetch(`/api/arrangements/${id}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ name: newName.trim() })
                        });
                        if (res.ok) {
                            window.location.reload();
                        } else {
                            alert("Erro ao renomear arranjo.");
                        }
                    }
                    return;
                }

                const deleteBtn = e.target.closest(".btn-action-delete");
                if (deleteBtn) {
                    e.stopPropagation();
                    const id = deleteBtn.dataset.id;
                    if (confirm("Tem certeza que deseja excluir este arranjo?")) {
                        const res = await fetch(`/api/arrangements/${id}`, { method: "DELETE" });
                        if (res.ok) {
                            window.location.reload();
                        } else {
                            alert("Erro ao excluir arranjo.");
                        }
                    }
                    return;
                }
            });
        });


        // Criação de Nova Coleção
        const collectionListContainer = document.getElementById("collection-list-container");
        const btnAddCollection = document.getElementById("btn-add-collection");

        // Criação Inline de Coleção
        if (btnAddCollection && collectionListContainer) {
            btnAddCollection.addEventListener("click", () => {
                // Evita criar outro input se já houver um aberto
                if (document.getElementById("new-collection-input")) {
                    document.getElementById("new-collection-input").focus();
                    return;
                }

                const emptyMsg = collectionListContainer.querySelector(".empty-col-msg");
                if (emptyMsg) emptyMsg.remove();

                const li = document.createElement("li");
                li.innerHTML = `
                <div class="lib-btn-collection active" style="cursor: default;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <input type="text" id="new-collection-input" value="Nova Coleção" style="background: transparent; border: 1px solid var(--color-primary, #6366f1); border-radius: 4px; padding: 2px 6px; font-size: 0.9rem; color: inherit; width: 100%; outline: none;">
                </div>
            `;
                collectionListContainer.appendChild(li);

                const input = document.getElementById("new-collection-input");
                input.focus();
                input.select();

                let isSaving = false;

                const saveNew = async () => {
                    if (isSaving) return;
                    isSaving = true;
                    const name = input.value.trim();
                    if (!name) {
                        li.remove();
                        return;
                    }

                    try {
                        const res = await fetch("/api/collections", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ name })
                        });
                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            alert(err.detail || "Erro ao criar coleção.");
                            li.remove();
                        } else {
                            window.location.reload();
                        }
                    } catch (e) {
                        li.remove();
                    }
                };

                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        saveNew();
                    } else if (e.key === "Escape") {
                        li.remove();
                    }
                });

                input.addEventListener("blur", saveNew);
            });
        }

        // Edição por Duplo Clique
        if (collectionListContainer) {
            collectionListContainer.addEventListener("dblclick", (e) => {
                const btn = e.target.closest(".lib-btn-collection");
                if (!btn || btn.querySelector("input")) return;

                const colId = btn.dataset.collectionId;
                const textSpan = btn.querySelector(".col-name-text");
                if (!textSpan || !colId) return;

                const currentName = textSpan.textContent.trim();
                const input = document.createElement("input");
                input.type = "text";
                input.value = currentName;
                input.style.cssText = "background: transparent; border: 1px solid var(--color-primary, #6366f1); border-radius: 4px; padding: 2px 6px; font-size: 0.9rem; color: inherit; width: 100%; outline: none;";

                textSpan.style.display = "none";
                btn.appendChild(input);
                input.focus();
                input.select();

                let isSaving = false;

                const saveEdit = async () => {
                    if (isSaving) return;
                    isSaving = true;
                    const newName = input.value.trim();

                    if (!newName || newName === currentName) {
                        input.remove();
                        textSpan.style.display = "";
                        return;
                    }

                    try {
                        const res = await fetch(`/api/collections/${colId}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ name: newName })
                        });

                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            alert(err.detail || "Erro ao renomear coleção.");
                            input.remove();
                            textSpan.style.display = "";
                        } else {
                            textSpan.textContent = newName;
                            input.remove();
                            textSpan.style.display = "";
                        }
                    } catch (e) {
                        input.remove();
                        textSpan.style.display = "";
                    }
                };

                input.addEventListener("keydown", (evt) => {
                    if (evt.key === "Enter") {
                        evt.preventDefault();
                        saveEdit();
                    } else if (evt.key === "Escape") {
                        input.remove();
                        textSpan.style.display = "";
                    }
                });

                input.addEventListener("blur", saveEdit);
            });
        }

        // Gerenciamento de classes ativas na barra lateral
        document.addEventListener("click", (e) => {
            const colBtn = e.target.closest(".lib-btn-collection, #btn-all-arrangements");
            if (colBtn) {
                document.querySelectorAll(".lib-btn-collection, #btn-all-arrangements").forEach(b => {
                    b.classList.remove("active");
                });
                colBtn.classList.add("active");
            }
        });
    </script>
</body>

</html>
