{% for col in collections %}
<li data-collection-item-id="{{ col.id }}">
    <button 
        type="button" 
        class="lib-btn-collection" 
        data-collection-id="{{ col.id }}"
        hx-get="/biblioteca/search?collection_id={{ col.id }}"
        hx-target="#arrangements-grid"
        hx-include="#lib-search-input, #lib-sort-select"
    >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="col-name-text">{{ col.name }}</span>
    </button>
</li>
{% else %}
<li class="empty-col-msg" style="font-size: 0.85rem; color: var(--color-text-muted); padding: 4px 12px;">Nenhuma coleção criada</li>
{% endfor %}
