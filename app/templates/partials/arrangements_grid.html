{% for arr in arrangements %}
<div class="lib-card" onclick="window.location.href='/?id={{ arr.id }}'">
    <div class="lib-card-img-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
        </svg>
    </div>
    <div class="lib-card-info">
        <span class="lib-card-title">{{ arr.name }}</span>
        <span class="lib-card-date">{{ arr.created_at.strftime('%d/%m/%Y') }}</span>
    </div>

    <div class="lib-card-menu-wrapper" onclick="event.stopPropagation()">
        <button class="lib-card-menu">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5" r="2"></circle>
                <circle cx="12" cy="12" r="2"></circle>
                <circle cx="12" cy="19" r="2"></circle>
            </svg>
        </button>
        <div class="lib-card-dropdown">
            <button type="button" class="btn-action-edit" data-id="{{ arr.id }}">Editar Arranjo</button>
            <button type="button" class="btn-action-rename" data-id="{{ arr.id }}" data-name="{{ arr.name }}">Renomear</button>
            <div class="lib-dropdown-divider"></div>
            <button type="button" class="danger btn-action-delete" data-id="{{ arr.id }}">Excluir</button>
        </div>
    </div>
</div>
{% else %}
<div style="grid-column: 1 / -1; text-align: center; color: var(--color-text-muted); padding: 40px 0;">
    <p style="font-size: 1.1rem; font-weight: 600;">Nenhum arranjo encontrado.</p>
    <p style="font-size: 0.9rem; margin-top: 4px;">Tente ajustar os termos da busca.</p>
</div>
{% endfor %}
