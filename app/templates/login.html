<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyGroove — Login</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-body">
    <main class="login-split-layout">

        <!-- Lado Esquerdo (Roxo) -->
        <section class="login-left">
            <div class="login-left-content">
                <h1 class="login-heading">Bem-vindo<br>Groover! <span class="drum-emoji">🥁</span></h1>
                <p class="login-subtitle">
                    O <strong>EasyGroove</strong> é uma plataforma para notação rítmica. Escreva, salve e organize seus
                    arranjos em uma interface intuitiva.
                </p>
            </div>
            <footer class="login-footer">
                2026 - EasyGroove
            </footer>
        </section>

        <!-- Lado Direito (Branco) -->
        <section class="login-right">
            <div class="login-form-container">

                <div class="login-logo-wrapper">
                    <img src="assets/icons/logo.svg" alt="EasyGroove Logo" class="login-logo">
                    <h2 class="login-brand-text">EasyGroove</h2>
                </div>

                <form id="login-form" class="login-form">

                    <div id="login-error-msg" style="display: none; color: #dc2626; font-size: 0.9rem; font-weight: 600; text-align: center; margin-bottom: 8px;"></div>

                    <div class="input-group">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="login-username" placeholder="Usuário" required autocomplete="username">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="login-password" placeholder="Senha" required autocomplete="current-password">
                    </div>

                    <div class="forgot-password-link">
                        <a href="#">esqueci minha senha</a>
                    </div>

                    <button type="submit" id="btn-submit-login" class="btn-login-submit">Entrar</button>

                    <div class="signup-link">
                        Não tem uma conta? <a href="#" id="link-create-account">Criar nova conta</a>
                    </div>

                </form>

            </div>
        </section>

    </main>

    <script>
        const loginForm = document.getElementById("login-form");
        const usernameInput = document.getElementById("login-username");
        const passwordInput = document.getElementById("login-password");
        const errorMsg = document.getElementById("login-error-msg");
        const submitBtn = document.getElementById("btn-submit-login");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.textContent = "Entrando...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: usernameInput.value.trim(),
                        password: passwordInput.value
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Usuário ou senha incorretos.");
                }

                // Redireciona para a biblioteca após login bem-sucedido
                window.location.href = "/biblioteca";
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Entrar";
            }
        });
    </script>
</body>

</html>
