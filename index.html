<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyGroove — Editor de Arranjos Rítmicos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- 1. Top Header -->
    <header class="top-header">
        <div class="header-left">
            <div class="brand-logo">
                <span>⚡</span> EasyGroove
            </div>
            <div class="arrangement-title-container">
                <span class="arrangement-title" contenteditable="true" spellcheck="false">Bossa Nova Principal</span>
            </div>
        </div>

        <!-- Player Centralizado -->
        <div class="header-center">
            <button type="button" id="btn-loop" class="player-btn" title="Loop Ativo/Inativo">🔁</button>
            <button type="button" id="btn-play" class="player-btn primary" title="Tocar / Pausar">▶</button>
            <button type="button" id="btn-stop" class="player-btn" title="Parar e Voltar ao Início">⏹</button>
            <div class="player-divider"></div>
            <div class="bpm-control">
                <span>BPM</span>
                <input type="number" id="bpm-input" class="bpm-input" value="120" min="40" max="260">
            </div>
        </div>

        <!-- Ações e Menu à Direita -->
        <div class="header-right">
            <button type="button" class="action-btn" title="Exportar Arranjo">Exportar</button>
            <button type="button" class="action-btn" title="Salvar Projeto">Salvar</button>
            <button type="button" class="action-btn icon-only" title="Ajuda e Legenda">?</button>
        </div>
    </header>

    <!-- 2. Workspace Principal -->
    <main class="workspace-container">

        <!-- Sidebar de Instrumentos -->
        <aside class="instruments-sidebar">
            <div id="instruments-sidebar-list" class="sidebar-list">
                <button type="button" class="btn-add-instrument">+ Instrumento</button>
            </div>
        </aside>

        <!-- Área de Grade com Scroll Horizontal -->
        <div class="score-viewport">
            <div class="score-content">
                <!-- Faixa de cabeçalhos de compassos -->
                <div id="measures-track" class="measures-track"></div>

                <!-- Grade de Pautas e Notas -->
                <div id="score-grid" class="score-grid">
                    <div id="playhead" class="playhead"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- 3. Toolbar Flutuante Inferior -->
    <div class="floating-editor-bar">
        <button type="button" id="btn-undo" class="tool-btn" title="Desfazer (Ctrl+Z)">↺</button>

        <div class="tool-palette">
            <button type="button" class="palette-inst-badge">🪘 <span id="active-tool-name">Caixa</span> ▾</button>
            <div class="palette-divider"></div>
            <button type="button" class="tool-stroke active" title="Toque Forte">●</button>
            <button type="button" class="tool-stroke" title="Toque Fraco / Nota Fantasma">•</button>
            <button type="button" class="tool-stroke" title="Toque Acentuado">⦿</button>
        </div>

        <button type="button" id="btn-redo" class="tool-btn" title="Refazer (Ctrl+Y)">↻</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="assets/js/audio.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
